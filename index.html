<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<meta name="description" content="Um RPG pessoal para transformar ações reais em evolução.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Ascensão — RPG Pessoal</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101a2b;--panel2:#17243a;--line:#263b5b;--text:#eef5ff;--muted:#9aacc6;--blue:#2788ff;--blue2:#78bdff;--green:#83e0b2;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#12366b 0%,var(--bg) 52%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer} .app{max-width:760px;margin:auto;padding:20px 15px 95px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 20px}.brand{display:flex;align-items:center;gap:10px}.brandmark{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#8acbff,#176bdb);display:grid;place-items:center;color:#20130d;font-size:24px;font-weight:900;box-shadow:0 8px 25px #2788ff35}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--blue2);font-weight:800}.brand h1{font-size:20px;margin:0}.top-actions{display:flex;gap:7px}.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:9px 11px}
.hero{border:1px solid #244b7d;background:linear-gradient(125deg,#10294b,#101a2b 72%);border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:22px;top:15px;font-size:68px;color:#2788ff20}.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.rank{color:var(--blue2);font-size:12px;font-weight:800;letter-spacing:1.5px}.hero h2{font-size:27px;margin:5px 0}.sub{color:var(--muted);font-size:13px}.level{width:60px;height:60px;flex-shrink:0;border-radius:18px;border:1px solid #38669d;background:#142b4b;display:grid;place-items:center;color:var(--blue2);font-size:24px;font-weight:900}.xp-row{display:flex;justify-content:space-between;font-size:12px;color:#d2d2d7;margin:18px 0 7px}.bar{height:10px;background:#253750;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:99px;transition:width .25s}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px}.stathead{display:flex;align-items:center;gap:8px;font-weight:750;font-size:13px}.stat-icon{font-size:18px}.statnum{font-size:24px;font-weight:850;margin:8px 0 2px}.stat small{color:var(--muted);font-size:11px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px;gap:10px}.section-head h3{margin:0;font-size:18px}.muted{color:var(--muted);font-size:12px}.pill{font-size:11px;border:1px solid #315b8b;color:var(--blue2);border-radius:99px;padding:5px 9px;background:#142943}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 12px;position:sticky;top:0;z-index:3;background:#080d18f2;backdrop-filter:blur(12px)}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:10px 12px;white-space:nowrap;font-size:13px}.tab.active{background:var(--blue);border-color:var(--blue);color:#24150d;font-weight:850}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}.quest{display:flex;gap:12px;align-items:center}.quest-check{width:27px;height:27px;flex-shrink:0;border-radius:9px;border:1px solid #575a65;background:#24262d;color:#071326;display:grid;place-items:center;font-weight:900}.quest.done .quest-check{background:var(--green);border-color:var(--green)}.quest.done .quest-title{text-decoration:line-through;color:#8d929a}.quest-main{flex:1;min-width:0}.quest-title{font-weight:750;font-size:14px}.quest-meta{font-size:11px;color:var(--muted);margin-top:4px}.xp{color:var(--blue2);font-weight:850;font-size:13px;white-space:nowrap}.quest-actions{display:flex;gap:5px}.tiny{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px;padding:6px 8px}
.primary{border:0;background:linear-gradient(110deg,#1674e8,#63b5ff);color:#061326;font-weight:850;border-radius:13px;padding:12px 15px}.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 12px}.full{width:100%}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:5px}
.formrow{display:flex;gap:8px;flex-wrap:wrap}.field{width:100%;background:#0b1423;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:11px;outline:none}.field:focus{border-color:var(--blue)}.formgrid{display:grid;grid-template-columns:1fr 120px;gap:8px}.label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}.achievement{display:flex;align-items:center;gap:12px}.ach-icon{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:#172b46;font-size:22px}.locked{opacity:.45;filter:grayscale(1)}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{font-size:12px;color:var(--muted);line-height:1.5}.exercise{display:flex;gap:12px;align-items:flex-start}.exercise-icon{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;border-radius:13px;background:#172b46;font-size:21px}.exercise b{display:block;font-size:14px}.exercise p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.training-badge{font-size:11px;color:var(--blue2);border:1px solid #315b8b;padding:4px 8px;border-radius:99px;white-space:nowrap}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#f2f2f2;color:#151515;padding:12px 16px;border-radius:13px;font-weight:750;box-shadow:0 8px 30px #0008;z-index:20;max-width:90%;text-align:center}.hidden{display:none!important}.bottomnav{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#080d18ee;border-top:1px solid #292b31;backdrop-filter:blur(14px);display:flex;justify-content:center;z-index:5}.bottomnav-inner{display:flex;width:100%;max-width:760px;justify-content:space-around}.navitem{display:grid;gap:3px;justify-items:center;color:var(--muted);font-size:10px;border:0;background:transparent;padding:4px 12px}.navitem span:first-child{font-size:20px}.navitem.active{color:var(--blue2)}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:25px}.app{padding-top:26px}.quest-title{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="brandmark">✦</div><div><div class="eyebrow">SEU SISTEMA DE EVOLUÇÃO</div><h1>ASCENSÃO</h1></div></div>
 <div class="top-actions"><button class="iconbtn" id="installBtn" title="Instalar app" hidden>⇩</button><button class="iconbtn" id="backupBtn" title="Backup">↗</button></div>
</header>
<nav class="tabs" aria-label="Navegação">
 <button class="tab active" data-page="home">⚔️ Painel</button><button class="tab" data-page="training">🏋️ Treino</button><button class="tab" data-page="quests">📜 Missões</button><button class="tab" data-page="achievements">🏆 Conquistas</button><button class="tab" data-page="settings">⚙️ Sistema</button>
</nav>
<main id="page"></main>
</div>
<div class="bottomnav"><div class="bottomnav-inner">
 <button class="navitem active" data-page="home"><span>⚔️</span>Painel</button><button class="navitem" data-page="training"><span>🏋️</span>Treino</button><button class="navitem" data-page="quests"><span>📜</span>Missões</button><button class="navitem" data-page="achievements"><span>🏆</span>Conquistas</button><button class="navitem" data-page="settings"><span>⚙️</span>Sistema</button>
</div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const KEY='ascensao-rpg-v1';
const defaultState={
 name:'Aventureiro',xp:0,totalXp:0,level:1,createdAt:new Date().toISOString(),trainingLog:[],
 stats:{inteligencia:1,forca:1,disciplina:1,energia:1,financas:1},
 quests:[
 {id:'q1',title:'Estudar ou praticar uma habilidade',category:'inteligencia',xp:25,repeat:'daily',doneDates:[]},
 {id:'q2',title:'Movimentar o corpo por 20 minutos',category:'forca',xp:25,repeat:'daily',doneDates:[]},
 {id:'q3',title:'Cumprir uma tarefa que estava adiando',category:'disciplina',xp:20,repeat:'daily',doneDates:[]},
 {id:'q4',title:'Cuidar do sono, água ou uma pausa consciente',category:'energia',xp:15,repeat:'daily',doneDates:[]},
 {id:'q5',title:'Revisar gastos ou guardar algum dinheiro',category:'financas',xp:20,repeat:'weekly',doneDates:[]}
 ],history:[],streak:0,lastActiveDate:null,customIds:0
};
const statInfo={
 inteligencia:{label:'Inteligência',icon:'🧠',desc:'Estudo, leitura e habilidades'},
 forca:{label:'Força',icon:'💪',desc:'Movimento e treino físico'},
 disciplina:{label:'Disciplina',icon:'🛡️',desc:'Consistência e compromissos'},
 energia:{label:'Energia',icon:'⚡',desc:'Sono, recuperação e autocuidado'},
 financas:{label:'Finanças',icon:'💰',desc:'Organização e hábitos financeiros'}
};
let state=loadState(),page='home',installPrompt=null;
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.quests&&s.stats)return {...structuredClone(defaultState),...s,stats:{...defaultState.stats,...s.stats}}}catch(e){}return structuredClone(defaultState)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateLabel(){return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
function xpForNext(level=state.level){return 100+(level-1)*50}
function levelFromTotal(total){let lvl=1,left=total;while(left>=100+(lvl-1)*50){left-=100+(lvl-1)*50;lvl++}return {level:lvl,xp:left,need:100+(lvl-1)*50}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function completedToday(q){return (q.doneDates||[]).includes(today())}
function completedThisWeek(q){const d=new Date();const monday=new Date(d);monday.setDate(d.getDate()-(d.getDay()+6)%7);monday.setHours(0,0,0,0);return (q.doneDates||[]).some(x=>new Date(x+'T12:00:00')>=monday)}
function isDone(q){return q.repeat==='weekly'?completedThisWeek(q):completedToday(q)}
function addXP(q){state.totalXp+=q.xp;const old=state.level;const l=levelFromTotal(state.totalXp);state.level=l.level;state.xp=l.xp;state.stats[q.category]=(state.stats[q.category]||1)+1;state.history.unshift({date:today(),title:q.title,xp:q.xp,category:q.category});state.history=state.history.slice(0,100);updateStreak();save();render();toast(state.level>old?`SUBIU DE NÍVEL! Agora você é nível ${state.level}.`:`+${q.xp} XP — missão concluída!`)}
function updateStreak(){const t=today();if(state.lastActiveDate===t)return;const y=new Date();y.setDate(y.getDate()-1);const yesterday=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;state.streak=state.lastActiveDate===yesterday?state.streak+1:1;state.lastActiveDate=t}
function completeQuest(id){const q=state.quests.find(q=>q.id===id);if(!q||isDone(q))return;q.doneDates=q.doneDates||[];q.doneDates.push(today());addXP(q)}
function undoQuest(id){const q=state.quests.find(q=>q.id===id);if(!q||!isDone(q))return;const date=q.repeat==='weekly'?(q.doneDates||[]).slice(-1)[0]:today();q.doneDates=(q.doneDates||[]).filter(d=>d!==date);state.totalXp=Math.max(0,state.totalXp-q.xp);state.history=state.history.filter((h,i)=>!(i===0&&h.title===q.title&&h.date===date));state.stats[q.category]=Math.max(1,(state.stats[q.category]||1)-1);const l=levelFromTotal(state.totalXp);state.level=l.level;state.xp=l.xp;save();render();toast('Conclusão desfeita.')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}
function questCard(q){const done=isDone(q);return `<div class="panel quest ${done?'done':''}"><button class="quest-check" aria-label="${done?'Desfazer':'Concluir'} missão" onclick="${done?'undoQuest':'completeQuest'}('${q.id}')">${done?'✓':''}</button><div class="quest-main"><div class="quest-title">${escapeHtml(q.title)}</div><div class="quest-meta">${statInfo[q.category]?.icon||'✦'} ${statInfo[q.category]?.label||'Geral'} · ${q.repeat==='weekly'?'Semanal':'Diária'}${q.custom?' · Personalizada':''}</div></div><div class="xp">+${q.xp} XP</div>${q.custom?`<button class="tiny" aria-label="Excluir missão" onclick="deleteQuest('${q.id}')">×</button>`:''}</div>`}
function home(){const l=levelFromTotal(state.totalXp);const daily=state.quests.filter(q=>q.repeat!=='weekly');const done=daily.filter(isDone).length;return `
<section class="hero"><div class="hero-top"><div><div class="rank">RANK ${rankName(state.level).toUpperCase()}</div><h2>${escapeHtml(state.name||'Aventureiro')}</h2><div class="sub">Toda ação real conta para a tua evolução.</div></div><div class="level">${state.level}</div></div><div class="xp-row"><span>NÍVEL ${state.level}</span><span>${state.xp} / ${l.need} XP</span></div><div class="bar"><span style="width:${Math.min(100,state.xp/l.need*100)}%"></span></div></section>
<div class="stats">${Object.entries(statInfo).map(([k,v])=>`<div class="stat"><div class="stathead"><span class="stat-icon">${v.icon}</span>${v.label}</div><div class="statnum">${state.stats[k]||1}</div><small>${v.desc}</small></div>`).join('')}<div class="stat"><div class="stathead"><span class="stat-icon">🔥</span>Sequência</div><div class="statnum">${state.streak}</div><small>dias ativos registrados</small></div></div>
<div class="section-head"><h3>Missões de hoje</h3><span class="pill">${done}/${daily.length} concluídas</span></div>
${daily.slice(0,4).map(questCard).join('')||'<div class="empty">Nenhuma missão ainda.</div>'}
<button class="secondary full" onclick="setPage('quests')">Ver todas as missões →</button>
<div class="section-head"><h3>Últimas conquistas reais</h3></div>
<div class="panel"><div class="achievement"><div class="ach-icon">🎯</div><div><b>${state.totalXp} XP acumulados</b><div class="muted">Cada pequeno passo soma.</div></div></div></div>
<div class="note">📌 Dica: escolha metas realistas. Descansar também faz parte da evolução — não precisas cumprir tudo todos os dias.</div>`}
const starterWorkout=[
{icon:'🚶',name:'Aquecimento leve',dose:'3–5 minutos',detail:'Marcha no lugar e movimentos suaves dos braços. Comece devagar.'},
{icon:'🪑',name:'Agachamento até a cadeira',dose:'6–10 repetições',detail:'Leve o quadril para trás e use a cadeira como referência. Movimento confortável.'},
{icon:'🧱',name:'Flexão na parede',dose:'6–10 repetições',detail:'Mãos na parede, corpo alinhado e movimento controlado.'},
{icon:'🌉',name:'Elevação de quadril',dose:'8–12 repetições',detail:'Deitado, joelhos flexionados; eleve o quadril sem forçar a lombar.'},
{icon:'🐦',name:'Bird-dog (alternado)',dose:'5 por lado',detail:'Em quatro apoios, estenda braço e perna opostos sem girar o tronco.'},
{icon:'🌬️',name:'Volta à calma',dose:'2–3 minutos',detail:'Caminhe devagar e respire. Alongue suavemente apenas se for confortável.'}
];
function trainingPage(){const logs=state.trainingLog||[];const todayLog=logs.find(x=>x.date===today());return `<div class="section-head"><h3>🏋️ Treinamento</h3><span class="training-badge">INICIANTE · SEM EQUIPAMENTO</span></div><section class="hero"><div class="rank">MISSÃO DE EVOLUÇÃO</div><h2>Construindo sua base</h2><div class="sub">Um começo simples para criar consistência em casa. Faça no seu ritmo.</div><div class="xp-row"><span>RECOMPENSA</span><span>+25 XP · Força +1</span></div></section><div class="panel"><b>Antes de começar</b><p class="note">Esta é uma sugestão geral, não uma avaliação física. Se estiver começando, faça apenas uma volta e descanse quando precisar. Adapte ou pule qualquer movimento que não seja adequado para você. Pare se sentir dor, tontura ou falta de ar fora do normal.</p></div><div class="section-head"><h3>⚔️ Treino básico A</h3><span class="muted">15–25 min aprox.</span></div>${starterWorkout.map((e,i)=>`<div class="panel exercise"><div class="exercise-icon">${e.icon}</div><div style="flex:1"><b>${i+1}. ${e.name}</b><div class="training-badge">${e.dose}</div><p>${e.detail}</p></div></div>`).join('')}<div class="panel"><b>Como registrar</b><p class="note">Concluiu a sessão? Registre abaixo. O sistema libera XP uma vez por dia para evitar pontuação duplicada. Dia de descanso também faz parte do progresso.</p>${todayLog?`<div class="quest-meta">✓ Treino registrado hoje · ${todayLog.date}</div>`:`<button class="primary full" onclick="completeWorkout()">✓ Registrar treino concluído · +25 XP</button>`}</div><div class="section-head"><h3>📈 Histórico de treino</h3><span class="pill">${logs.length} sessões</span></div>${logs.slice(0,8).map(x=>`<div class="panel quest"><div class="quest-main"><div class="quest-title">Treino básico A</div><div class="quest-meta">${x.date}</div></div><div class="xp">+25 XP</div></div>`).join('')||'<div class="empty">Sua primeira sessão aparecerá aqui.</div>'}`}
function completeWorkout(){state.trainingLog=state.trainingLog||[];if(state.trainingLog.some(x=>x.date===today())){toast('Você já registrou um treino hoje.');return}state.trainingLog.unshift({date:today(),type:'starter-a'});state.totalXp+=25;const old=state.level;const l=levelFromTotal(state.totalXp);state.level=l.level;state.xp=l.xp;state.stats.forca=(state.stats.forca||1)+1;state.history.unshift({date:today(),title:'Treino básico A',xp:25,category:'forca'});state.history=state.history.slice(0,100);updateStreak();save();render();toast(state.level>old?`SUBIU DE NÍVEL! Agora você é nível ${state.level}.`:'+25 XP — treino registrado!')}
function rankName(level){if(level>=30)return 'Lendário';if(level>=20)return 'Mestre';if(level>=12)return 'Veterano';if(level>=7)return 'Explorador';if(level>=3)return 'Aprendiz';return 'Despertar'}
function questsPage(){const daily=state.quests.filter(q=>q.repeat!=='weekly'),weekly=state.quests.filter(q=>q.repeat==='weekly');return `<div class="section-head"><h3>📜 Quadro de missões</h3><span class="pill">${state.quests.length} ativas</span></div><div class="note">Conclua uma tarefa no mundo real e marque aqui. Missões concluídas só podem dar XP uma vez por período.</div><div class="section-head"><h3>Diárias</h3><span class="muted">${daily.filter(isDone).length}/${daily.length}</span></div>${daily.map(questCard).join('')||'<div class="empty">Nenhuma missão diária.</div>'}<div class="section-head"><h3>Semanais</h3></div>${weekly.map(questCard).join('')||'<div class="empty">Nenhuma missão semanal.</div>'}<div class="section-head"><h3>Adicionar missão</h3></div><div class="panel"><form id="questForm"><label class="label" for="qtitle">Nome da missão</label><input class="field" id="qtitle" maxlength="70" required placeholder="Ex.: praticar inglês por 15 minutos"><div class="formgrid"><div><label class="label" for="qcat">Atributo</label><select class="field" id="qcat">${Object.entries(statInfo).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('')}</select></div><div><label class="label" for="qxp">Recompensa XP</label><select class="field" id="qxp"><option value="10">10 XP</option><option value="15">15 XP</option><option value="20" selected>20 XP</option><option value="25">25 XP</option><option value="40">40 XP</option><option value="50">50 XP</option></select></div></div><label class="label" for="qrepeat">Frequência</label><select class="field" id="qrepeat"><option value="daily">Diária</option><option value="weekly">Semanal</option></select><button class="primary full" style="margin-top:12px" type="submit">＋ Criar missão</button></form></div>`}
function achievements(){const items=[
{icon:'🌱',name:'Primeiro passo',desc:'Conclua sua primeira missão.',ok:state.history.length>=1},
{icon:'📚',name:'Aprendiz',desc:'Alcance o nível 3.',ok:state.level>=3},
{icon:'🔥',name:'Ritmo crescente',desc:'Registre atividade em 3 dias diferentes.',ok:new Set(state.history.map(h=>h.date)).size>=3},
{icon:'💎',name:'Centenário',desc:'Acumule 100 XP no total.',ok:state.totalXp>=100},
{icon:'🏆',name:'Veterano',desc:'Alcance o nível 7.',ok:state.level>=7},
{icon:'🌟',name:'Consistência',desc:'Acumule 10 dias ativos.',ok:new Set(state.history.map(h=>h.date)).size>=10},
{icon:'🧭',name:'Arquiteto da rotina',desc:'Crie sua própria missão.',ok:state.quests.some(q=>q.custom)}
];return `<div class="section-head"><h3>🏆 Galeria de conquistas</h3><span class="pill">${items.filter(i=>i.ok).length}/${items.length}</span></div>${items.map(i=>`<div class="panel achievement ${i.ok?'':'locked'}"><div class="ach-icon">${i.icon}</div><div><b>${i.name}</b><div class="muted">${i.desc}</div><div class="quest-meta">${i.ok?'✓ Desbloqueada':'🔒 Ainda bloqueada'}</div></div></div>`).join('')}<div class="section-head"><h3>Histórico recente</h3></div>${state.history.slice(0,10).map(h=>`<div class="panel"><div class="quest"><div class="quest-main"><div class="quest-title">${escapeHtml(h.title)}</div><div class="quest-meta">${h.date} · ${statInfo[h.category]?.label||'Geral'}</div></div><div class="xp">+${h.xp} XP</div></div></div>`).join('')||'<div class="empty"><b>Teu caminho começa aqui.</b>Conclua uma missão para registrar a primeira vitória.</div>'}`}
function settings(){return `<div class="section-head"><h3>⚙️ Sistema</h3></div><div class="panel"><label class="label" for="playerName">Nome do personagem</label><input class="field" id="playerName" maxlength="35" value="${escapeHtml(state.name)}" placeholder="Aventureiro"><button class="primary full" style="margin-top:10px" onclick="saveName()">Salvar nome</button></div><div class="section-head"><h3>💾 Seus dados</h3></div><div class="panel"><p class="note">O progresso fica salvo neste navegador, neste aparelho. Limpar os dados do navegador pode apagar o jogo. Exporte um backup regularmente e guarde o arquivo em local seguro.</p><div class="settings-grid"><button class="secondary" onclick="exportBackup()">Exportar backup</button><button class="secondary" onclick="document.getElementById('importFile').click()">Importar backup</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></div><div class="section-head"><h3>🔄 Reiniciar</h3></div><div class="panel"><p class="note">Isso apaga o personagem, missões personalizadas e histórico deste aparelho. Exporte um backup antes de continuar.</p><button class="secondary full" onclick="resetGame()">Reiniciar progresso</button></div><div class="section-head"><h3>Sobre o Ascensão</h3></div><div class="panel"><p class="note">Versão 2.0 · Projeto pessoal e gratuito. Sem conta, sem anúncios e sem pagamentos. A pontuação é uma ferramenta de motivação, não uma medida do teu valor pessoal.</p><p class="note">Para instalar: publique os arquivos em um site HTTPS e use o menu do navegador → “Adicionar à tela inicial” ou “Instalar app”.</p></div>`}
function render(){const el=document.getElementById('page');el.innerHTML=page==='home'?home():page==='training'?trainingPage():page==='quests'?questsPage():page==='achievements'?achievements():settings();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const form=document.getElementById('questForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('qtitle').value.trim();if(!title)return;state.customIds++;state.quests.push({id:'custom'+state.customIds,title,category:document.getElementById('qcat').value,xp:Number(document.getElementById('qxp').value),repeat:document.getElementById('qrepeat').value,doneDates:[],custom:true});save();render();toast('Missão criada!')});const file=document.getElementById('importFile');if(file)file.addEventListener('change',importBackup)}
function deleteQuest(id){const q=state.quests.find(q=>q.id===id);if(!q||!q.custom)return;if(!confirm(`Excluir a missão “${q.title}”?`))return;state.quests=state.quests.filter(q=>q.id!==id);save();render();toast('Missão excluída.')}
function saveName(){state.name=document.getElementById('playerName').value.trim()||'Aventureiro';save();render();toast('Nome atualizado!')}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ascensao-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exportado. Guarde o arquivo!')}
function importBackup(e){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const s=JSON.parse(reader.result);if(!s.quests||!s.stats||typeof s.totalXp!=='number')throw Error();if(!confirm('Importar este backup substituirá o progresso atual. Continuar?'))return;state={...structuredClone(defaultState),...s,stats:{...defaultState.stats,...s.stats}};const l=levelFromTotal(state.totalXp);state.level=l.level;state.xp=l.xp;save();render();toast('Backup restaurado!')}catch(err){alert('Não foi possível importar. Escolha um backup válido do Ascensão.')}e.target.value=''};reader.readAsText(f)}
function resetGame(){if(!confirm('Tem certeza? Todo o progresso atual será apagado deste aparelho.'))return;if(!confirm('Última confirmação: deseja reiniciar o jogo?'))return;state=structuredClone(defaultState);save();setPage('home');toast('Novo começo. Sua jornada recomeça agora.')}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.getElementById('backupBtn').addEventListener('click',exportBackup);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').hidden=false});
document.getElementById('installBtn').addEventListener('click',async()=>{if(!installPrompt){toast('Use o menu do navegador para adicionar à tela inicial.');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').hidden=true});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
save();render();
</script>
